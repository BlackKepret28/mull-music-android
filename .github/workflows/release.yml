name: Rilis APK

# Jalan waktu tag v* di-push, misalnya `git tag v0.1.0 && git push origin v0.1.0`.
# Tag HARUS sama dengan `version:` di pubspec.yaml (tanpa huruf v dan tanpa +build).
on:
  push:
    tags:
      - "v*"
  # Boleh juga dijalankan manual buat ngetes workflow-nya tanpa bikin rilis.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Dipatok biar hasil build nggak berubah diam-diam waktu Flutter rilis baru.
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Cek versi tag cocok dengan pubspec
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pub=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          echo "tag=$tag pubspec=$pub"
          if [ "$tag" != "$pub" ]; then
            echo "::error::Tag $GITHUB_REF_NAME nggak cocok sama version: $pub di pubspec.yaml"
            exit 1
          fi

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum diisi. Lihat README bagian Rilis."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/mull.jks
          cat > android/key.properties <<EOF
          storeFile=mull.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # --split-per-abi bikin satu APK per arsitektur, jadi ukurannya jauh
      # lebih kecil daripada satu APK gabungan.
      - run: flutter build apk --release --split-per-abi

      - name: Bikin sha256
        working-directory: build/app/outputs/flutter-apk
        run: |
          for f in *.apk; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Hapus kunci
        if: always()
        run: rm -f android/mull.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/*.sha256

      - name: Terbitkan rilis
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/*.sha256
