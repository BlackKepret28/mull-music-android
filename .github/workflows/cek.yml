name: Cek kode

# Jalan tiap ada push (branch apa pun) atau PR: flutter analyze + flutter test.
# Kalau gagal, otomatis dibuatkan Issue berisi bagian akhir lognya, jadi
# hasilnya bisa dibaca dari HP tanpa buka log Actions satu-satu.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Samakan dengan release.yml.
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get

      - name: flutter analyze
        id: analisis
        shell: bash
        continue-on-error: true
        run: flutter analyze 2>&1 | tee analisis.log

      - name: flutter test
        id: tes
        shell: bash
        continue-on-error: true
        run: flutter test 2>&1 | tee tes.log

      - name: Laporkan kalau gagal
        if: steps.analisis.outcome == 'failure' || steps.tes.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Cabang: \`${GITHUB_REF_NAME}\`  ·  commit: \`${GITHUB_SHA::7}\`"
            echo "Log lengkap: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            if [ "${{ steps.analisis.outcome }}" = "failure" ]; then
              echo "### flutter analyze (80 baris terakhir)"
              echo '```'
              tail -n 80 analisis.log
              echo '```'
            fi
            if [ "${{ steps.tes.outcome }}" = "failure" ]; then
              echo "### flutter test (80 baris terakhir)"
              echo '```'
              tail -n 80 tes.log
              echo '```'
            fi
          } > laporan.md
          gh issue create \
            --title "CI gagal: ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" \
            --body-file laporan.md

      - name: Tandai gagal
        if: steps.analisis.outcome == 'failure' || steps.tes.outcome == 'failure'
        run: exit 1
